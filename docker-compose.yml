name: helm

services:
  postgres:
    image: postgres:16-alpine
    container_name: helm-postgres
    environment:
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
      POSTGRES_DB: helm
    ports:
      - "5432:5432"
    volumes:
      - helm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helm-redis
    ports:
      - "6379:6379"
    volumes:
      - helm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  helm_pg:
  helm_redis:
