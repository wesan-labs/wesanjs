name: helm

services:
  postgres:
    image: postgres:16-alpine
    container_name: helm-postgres
    environment:
      POSTGRES_USER: helm
      POSTGRES_PASSWORD: helm
      POSTGRES_DB: helm
    ports:
      - "5432:5432"
    volumes:
      - helm_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U helm"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: helm-redis
    # ADR-0005 K5: kuyruk verisi burada durur.
    #  appendonly yes    -> yeniden baslatmada kuyruktaki isler kaybolmaz
    #  noeviction        -> bellek dolunca Redis kuyruk anahtarlarini SILMEZ.
    #                       allkeys-lru olsaydi isler sessizce yok olurdu.
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --maxmemory-policy
      - noeviction
    ports:
      - "6379:6379"
    volumes:
      - helm_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  helm_pg:
  helm_redis:
